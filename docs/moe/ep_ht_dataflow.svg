<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1340" viewBox="0 0 920 1340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E65100"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C62828"/>
    </marker>
  </defs>

  <rect width="920" height="1340" fill="#FAFAFA"/>

  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#222">
    EP-HT data flow on rank r -- one MoE layer
  </text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#666">
    N = ep_world_size | E_local = E / N | H = hidden_size | K = top-k | RAGGED (no zero-padding)
  </text>

  <!-- Legend -->
  <g transform="translate(40, 70)">
    <rect x="0"   y="0" width="14" height="14" rx="2" fill="#E3F2FD" stroke="#1976D2"/>
    <text x="20"  y="12" font-size="11" fill="#333">compute</text>
    <rect x="90"  y="0" width="14" height="14" rx="2" fill="#E8F5E9" stroke="#388E3C"/>
    <text x="110" y="12" font-size="11" fill="#333">buffer (dynamic or persistent)</text>
    <rect x="310" y="0" width="14" height="14" rx="2" fill="#FFF3E0" stroke="#E65100"/>
    <text x="330" y="12" font-size="11" fill="#333">NCCL all_to_all_single (ragged)</text>
    <rect x="555" y="0" width="14" height="14" rx="2" fill="#F3E5F5" stroke="#6A1B9A"/>
    <text x="575" y="12" font-size="11" fill="#333">topk metadata (small)</text>
    <rect x="730" y="0" width="14" height="14" rx="2" fill="#FFEBEE" stroke="#C62828"/>
    <text x="750" y="12" font-size="11" fill="#333">host sync (breaks CUDA graph)</text>
  </g>

  <!-- Input -->
  <g>
    <rect x="360" y="105" width="200" height="38" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="460" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#0D47A1">hidden[T, H]</text>
    <text x="460" y="137" text-anchor="middle" font-size="10" fill="#1976D2">input to MoE block</text>
  </g>
  <line x1="460" y1="143" x2="460" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gate -->
  <g>
    <rect x="360" y="170" width="200" height="36" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="460" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">gate (linear)</text>
    <text x="460" y="200" text-anchor="middle" font-size="10" fill="#1976D2">router_logits[T, E_global]</text>
  </g>
  <line x1="460" y1="206" x2="460" y2="232" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DispatchEPHT box -->
  <g>
    <rect x="50" y="232" width="820" height="440" rx="10"
          fill="#FFFFFF" stroke="#1976D2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="65" y="252" font-size="13" font-weight="700" fill="#1976D2">DispatchEPHT</text>
    <text x="160" y="252" font-size="11" fill="#666">artifacts/modeling/layers/moe/dispatch_ep_ht.py</text>

    <!-- topk -->
    <rect x="300" y="270" width="320" height="40" rx="6"
          fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.3"/>
    <text x="460" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#4A148C">torch.topk + softmax</text>
    <text x="460" y="301" text-anchor="middle" font-size="10" fill="#6A1B9A">topk_ids[T,K] (int32) | topk_weights[T,K] (fp32)</text>
    <line x1="460" y1="310" x2="460" y2="330" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- sort by target rank -->
    <rect x="260" y="330" width="400" height="52" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="460" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">argsort by target_rank = topk_ids // E_local</text>
    <text x="460" y="363" text-anchor="middle" font-size="10" fill="#1976D2">sorted_hidden[T*K, H] -- tokens grouped by dest rank</text>
    <text x="460" y="376" text-anchor="middle" font-size="10" fill="#1976D2">sorted_local_eid[T*K] | sorted_topk_w[T*K] | sort_perm[T*K]</text>
    <line x1="460" y1="382" x2="460" y2="400" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- bincount + exchange counts -->
    <rect x="280" y="400" width="360" height="40" rx="6"
          fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="460" y="417" text-anchor="middle" font-size="12" font-weight="600" fill="#C62828">bincount + all_to_all(counts)</text>
    <text x="460" y="432" text-anchor="middle" font-size="10" fill="#C62828">send_counts[N], recv_counts[N] -- HOST SYNC (.tolist())</text>
    <line x1="460" y1="440" x2="460" y2="460" stroke="#C62828" stroke-width="1.5" marker-end="url(#arrowRed)"/>

    <!-- ragged a2a LEG 1 -->
    <rect x="220" y="460" width="480" height="56" rx="6"
          fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="460" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#BF360C">LEG 1 -- NCCL all_to_all_single (ragged)</text>
    <text x="460" y="495" text-anchor="middle" font-size="10" fill="#E65100">3 payloads: sorted_hidden, sorted_local_eid, sorted_topk_w</text>
    <text x="460" y="509" text-anchor="middle" font-size="10" fill="#E65100">input_split_sizes=send_counts | output_split_sizes=recv_counts</text>
    <line x1="460" y1="516" x2="460" y2="536" stroke="#E65100" stroke-width="1.8" marker-end="url(#arrowOrange)"/>

    <!-- recv buffers -->
    <rect x="260" y="536" width="400" height="42" rx="6"
          fill="#E8F5E9" stroke="#388E3C" stroke-width="1.3"/>
    <text x="460" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">recv_hidden[total_recv, H] bf16</text>
    <text x="460" y="567" text-anchor="middle" font-size="10" fill="#1B5E20">recv_local_eid[total_recv] int32 | recv_topk_w[total_recv] fp32</text>
    <line x1="460" y1="578" x2="460" y2="598" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- moe_align_block_size -->
    <rect x="250" y="598" width="420" height="52" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="460" y="616" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">sgl_kernel.moe_align_block_size</text>
    <text x="460" y="631" text-anchor="middle" font-size="10" fill="#1976D2">recv_topk_ids = recv_local_eid.view(-1, 1)</text>
    <text x="460" y="644" text-anchor="middle" font-size="10" fill="#1976D2">--> sorted_token_ids, expert_ids, num_tokens_post_padded</text>
  </g>
  <line x1="460" y1="672" x2="460" y2="698" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ExpertsEPHT box -->
  <g>
    <rect x="50" y="698" width="820" height="130" rx="10"
          fill="#FFFFFF" stroke="#1976D2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="65" y="718" font-size="13" font-weight="700" fill="#1976D2">ExpertsEPHT -- run_experts (standard triton_fused_moe)</text>
    <text x="380" y="718" font-size="11" fill="#666">same kernel as single-rank path</text>

    <rect x="120" y="736" width="260" height="40" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.3"/>
    <text x="250" y="754" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">triton_fused_moe (block-tiled)</text>
    <text x="250" y="769" text-anchor="middle" font-size="10" fill="#1976D2">recv_hidden @ w1.T -> intermediate</text>

    <rect x="400" y="736" width="120" height="40" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.3"/>
    <text x="460" y="754" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">silu_and_mul</text>
    <text x="460" y="769" text-anchor="middle" font-size="10" fill="#1976D2">2N -> N</text>

    <rect x="540" y="736" width="260" height="40" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.3"/>
    <text x="670" y="754" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">triton_fused_moe (block-tiled)</text>
    <text x="670" y="769" text-anchor="middle" font-size="10" fill="#1976D2">intermediate @ w2.T -> expert_out</text>

    <line x1="380" y1="756" x2="398" y2="756" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="520" y1="756" x2="538" y2="756" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="460" y="808" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
      topk_weights = 1.0 inside kernel; real weights applied post-reverse-a2a for fp32 precision
    </text>
  </g>
  <line x1="460" y1="828" x2="460" y2="856" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- expert_out -->
  <rect x="280" y="856" width="360" height="30" rx="6"
        fill="#E8F5E9" stroke="#388E3C" stroke-width="1.3"/>
  <text x="460" y="876" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">expert_out [total_recv, H] bf16  (compact, no padding)</text>
  <line x1="460" y1="886" x2="460" y2="910" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CombineEPHT box -->
  <g>
    <rect x="50" y="910" width="820" height="330" rx="10"
          fill="#FFFFFF" stroke="#1976D2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="65" y="930" font-size="13" font-weight="700" fill="#1976D2">CombineEPHT</text>
    <text x="155" y="930" font-size="11" fill="#666">artifacts/modeling/layers/moe/combine_ep_ht.py</text>

    <!-- reverse a2a LEG 2 -->
    <rect x="220" y="948" width="480" height="50" rx="6"
          fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="460" y="968" text-anchor="middle" font-size="13" font-weight="700" fill="#BF360C">LEG 2 -- NCCL all_to_all_single (ragged, reversed)</text>
    <text x="460" y="983" text-anchor="middle" font-size="10" fill="#E65100">output_split_sizes=send_counts | input_split_sizes=recv_counts</text>
    <text x="460" y="993" text-anchor="middle" font-size="10" fill="#E65100">rev[T*K, H] -- back in sorted-by-target-rank order</text>
    <line x1="460" y1="998" x2="460" y2="1020" stroke="#E65100" stroke-width="1.8" marker-end="url(#arrowOrange)"/>

    <!-- rev buffer -->
    <rect x="300" y="1020" width="320" height="28" rx="6"
          fill="#E8F5E9" stroke="#388E3C" stroke-width="1.3"/>
    <text x="460" y="1039" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">rev [T*K, H] bf16  (still sorted order)</text>
    <line x1="460" y1="1048" x2="460" y2="1070" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- un-permute -->
    <rect x="280" y="1070" width="360" height="42" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="460" y="1088" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">un-permute via sort_perm</text>
    <text x="460" y="1103" text-anchor="middle" font-size="10" fill="#1976D2">unperm[sort_perm[i]] = rev[i] --> unperm[T*K, H]</text>
    <line x1="460" y1="1112" x2="460" y2="1134" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- weight and reduce -->
    <rect x="250" y="1134" width="420" height="50" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="460" y="1153" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">weight-and-reduce</text>
    <text x="460" y="1168" text-anchor="middle" font-size="10" fill="#1976D2">unperm.view(T, K, H) * topk_weights[T, K, 1]</text>
    <text x="460" y="1180" text-anchor="middle" font-size="10" fill="#1976D2">out = sum(dim=1) --> [T, H]</text>
  </g>
  <line x1="460" y1="1240" x2="460" y2="1268" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="360" y="1268" width="200" height="38" rx="6"
        fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="460" y="1287" text-anchor="middle" font-size="13" font-weight="600" fill="#0D47A1">out[T, H]</text>
  <text x="460" y="1301" text-anchor="middle" font-size="10" fill="#1976D2">output of MoE block</text>

  <!-- Annotations: key differences vs EP-LL -->
  <g transform="translate(60, 460)">
    <rect x="0" y="340" width="215" height="100" rx="6" fill="#FFF8E1" stroke="#F57C00" stroke-width="1.2"/>
    <text x="108" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#BF360C">key diff vs EP-LL</text>
    <text x="10" y="374" font-size="10" fill="#333" font-family="monospace">  payload = actual tokens only</text>
    <text x="10" y="388" font-size="10" fill="#333" font-family="monospace">  no M_max, no zero-padding</text>
    <text x="10" y="402" font-size="10" fill="#333" font-family="monospace">  host sync required (counts)</text>
    <text x="10" y="416" font-size="10" fill="#333" font-family="monospace">  NO cuda graph compat</text>
    <text x="10" y="430" font-size="10" fill="#333" font-family="monospace">  standard fused_moe kernel</text>
    <text x="10" y="444" font-size="10" fill="#333" font-family="monospace">  no overflow risk</text>
  </g>

  <g transform="translate(645, 460)">
    <rect x="0" y="340" width="215" height="100" rx="6" fill="#FFF8E1" stroke="#F57C00" stroke-width="1.2"/>
    <text x="108" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#BF360C">NCCL payload (decode, 1 tok)</text>
    <text x="10" y="374" font-size="10" fill="#333" font-family="monospace">  hidden: K*H*2 bytes</text>
    <text x="10" y="388" font-size="10" fill="#333" font-family="monospace">    = 8*5120*2 = 80 KB</text>
    <text x="10" y="402" font-size="10" fill="#333" font-family="monospace">  eid: K*4 = 32 B</text>
    <text x="10" y="416" font-size="10" fill="#333" font-family="monospace">  topk_w: K*4 = 32 B</text>
    <text x="10" y="430" font-size="10" fill="#333" font-family="monospace">  total ~80 KB vs EP-LL</text>
    <text x="10" y="444" font-size="10" fill="#333" font-family="monospace">    M_max=1: 640 KB per leg</text>
  </g>

</svg>
