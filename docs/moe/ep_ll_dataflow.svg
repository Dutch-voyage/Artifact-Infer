<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E65100"/>
    </marker>
  </defs>

  <rect width="900" height="1180" fill="#FAFAFA"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#222">
    EP-LL data flow on rank r -- one MoE layer
  </text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666">
    N = ep_world_size | E_local = E / N | M_max = static bucket capacity | H = hidden_size | K = top-k
  </text>

  <g transform="translate(40, 70)">
    <rect x="0"   y="0" width="14" height="14" rx="2" fill="#E3F2FD" stroke="#1976D2"/>
    <text x="20"  y="12" font-size="11" fill="#333">compute</text>
    <rect x="90"  y="0" width="14" height="14" rx="2" fill="#E8F5E9" stroke="#388E3C"/>
    <text x="110" y="12" font-size="11" fill="#333">persistent buffer (MoeBackend)</text>
    <rect x="290" y="0" width="14" height="14" rx="2" fill="#FFF3E0" stroke="#E65100"/>
    <text x="310" y="12" font-size="11" fill="#333">NCCL all_to_all_single (the "two legs")</text>
    <rect x="555" y="0" width="14" height="14" rx="2" fill="#F3E5F5" stroke="#6A1B9A"/>
    <text x="575" y="12" font-size="11" fill="#333">topk metadata (small)</text>
  </g>

  <g>
    <rect x="350" y="105" width="200" height="38" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="450" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#0D47A1">hidden[T, H]</text>
    <text x="450" y="137" text-anchor="middle" font-size="10" fill="#1976D2">input to MoE block</text>
  </g>
  <line x1="450" y1="143" x2="450" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="350" y="170" width="200" height="36" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="450" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">gate (linear)</text>
    <text x="450" y="200" text-anchor="middle" font-size="10" fill="#1976D2">router_logits[T, E_global]</text>
  </g>
  <line x1="450" y1="206" x2="450" y2="232" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="232" width="800" height="290" rx="10"
          fill="#FFFFFF" stroke="#1976D2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="65" y="252" font-size="13" font-weight="700" fill="#1976D2">DispatchEPLL</text>
    <text x="160" y="252" font-size="11" fill="#666">artifacts/modeling/layers/moe/dispatch_ep_ll.py</text>

    <rect x="320" y="270" width="260" height="40" rx="6"
          fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.3"/>
    <text x="450" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#4A148C">torch.topk + softmax</text>
    <text x="450" y="301" text-anchor="middle" font-size="10" fill="#6A1B9A">topk_ids[T,K] (int32) | topk_weights[T,K] (fp32)</text>
    <line x1="450" y1="310" x2="450" y2="335" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="280" y="335" width="340" height="46" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="450" y="353" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">triton_ep_ll_dispatch (atomic slot alloc)</text>
    <text x="450" y="368" text-anchor="middle" font-size="10" fill="#1976D2">scatter hidden into send_buf, fill original_indices[N,E_local,M_max,2]</text>
    <line x1="450" y1="381" x2="450" y2="403" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="280" y="403" width="340" height="34" rx="6"
          fill="#E8F5E9" stroke="#388E3C" stroke-width="1.3"/>
    <text x="450" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">send_buf [N, E_local, M_max, H] bf16  ~ 1 GB at defaults</text>

    <rect x="280" y="455" width="340" height="42" rx="6"
          fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="450" y="475" text-anchor="middle" font-size="13" font-weight="700" fill="#BF360C">LEG 1 -- NCCL all_to_all_single</text>
    <text x="450" y="490" text-anchor="middle" font-size="10" fill="#E65100">recv_buf &lt;- send_buf  (group = ep_group, payload ~ 1 GB)</text>
    <line x1="450" y1="437" x2="450" y2="453" stroke="#E65100" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
    <line x1="450" y1="497" x2="450" y2="510" stroke="#E65100" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
  </g>

  <rect x="280" y="510" width="340" height="32" rx="6"
        fill="#E8F5E9" stroke="#388E3C" stroke-width="1.3"/>
  <text x="450" y="531" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">recv_buf [N, E_local, M_max, H] bf16</text>
  <line x1="450" y1="542" x2="450" y2="558" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="558" width="500" height="40" rx="6"
        fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="450" y="575" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">in-place strided copy (no transient)</text>
  <text x="450" y="589" text-anchor="middle" font-size="10" fill="#1976D2">hidden_recv.view(E,N,M,H).copy_(recv_buf.permute(1,0,2,3))</text>
  <line x1="450" y1="598" x2="450" y2="617" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="617" width="420" height="30" rx="6"
        fill="#E8F5E9" stroke="#388E3C" stroke-width="1.3"/>
  <text x="450" y="637" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">hidden_recv [E_local, N * M_max, H] bf16</text>
  <line x1="450" y1="647" x2="450" y2="668" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="668" width="800" height="118" rx="10"
          fill="#FFFFFF" stroke="#1976D2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="65" y="688" font-size="13" font-weight="700" fill="#1976D2">ExpertsEPLL -- run_experts_ll</text>
    <text x="240" y="688" font-size="11" fill="#666">artifacts/moe_backend/{torch,triton}_masked_grouped_gemm.py</text>

    <rect x="120" y="700" width="240" height="38" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.3"/>
    <text x="240" y="718" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">masked grouped GEMM #1</text>
    <text x="240" y="731" text-anchor="middle" font-size="10" fill="#1976D2">hidden_recv @ w1.T -&gt; ll_inter (2N)</text>

    <rect x="380" y="700" width="140" height="38" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.3"/>
    <text x="450" y="718" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">silu_and_mul</text>
    <text x="450" y="731" text-anchor="middle" font-size="10" fill="#1976D2">2N -&gt; N</text>

    <rect x="540" y="700" width="240" height="38" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.3"/>
    <text x="660" y="718" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">masked grouped GEMM #2</text>
    <text x="660" y="731" text-anchor="middle" font-size="10" fill="#1976D2">ll_inter @ w2.T -&gt; ll_out (H)</text>

    <line x1="360" y1="719" x2="378" y2="719" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="520" y1="719" x2="538" y2="719" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="450" y="765" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
      masked_m[e] = N*M_max  (over-approximation; zero-padded slots produce zero output)
    </text>
  </g>
  <line x1="450" y1="786" x2="450" y2="808" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="808" width="380" height="30" rx="6"
        fill="#E8F5E9" stroke="#388E3C" stroke-width="1.3"/>
  <text x="450" y="828" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">ll_out (= expert_out) [E_local, N * M_max, H]</text>
  <line x1="450" y1="838" x2="450" y2="858" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="858" width="800" height="232" rx="10"
          fill="#FFFFFF" stroke="#1976D2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="65" y="878" font-size="13" font-weight="700" fill="#1976D2">CombineEPLL</text>
    <text x="155" y="878" font-size="11" fill="#666">artifacts/modeling/layers/moe/combine_ep_ll.py</text>

    <rect x="200" y="894" width="500" height="40" rx="6"
          fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="450" y="911" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">in-place strided copy (no transient)</text>
    <text x="450" y="925" text-anchor="middle" font-size="10" fill="#1976D2">rev_send.permute(1,0,2,3).copy_(expert_out.view(E,N,M,H))</text>
    <line x1="450" y1="934" x2="450" y2="953" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="280" y="953" width="340" height="30" rx="6"
          fill="#E8F5E9" stroke="#388E3C" stroke-width="1.3"/>
    <text x="450" y="973" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">rev_send [N, E_local, M_max, H]</text>

    <rect x="280" y="1000" width="340" height="42" rx="6"
          fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="450" y="1020" text-anchor="middle" font-size="13" font-weight="700" fill="#BF360C">LEG 2 -- NCCL all_to_all_single</text>
    <text x="450" y="1035" text-anchor="middle" font-size="10" fill="#E65100">rev_recv &lt;- rev_send  (group = ep_group, payload ~ 1 GB)</text>
    <line x1="450" y1="983" x2="450" y2="998" stroke="#E65100" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
    <line x1="450" y1="1042" x2="450" y2="1057" stroke="#E65100" stroke-width="1.8" marker-end="url(#arrowOrange)"/>

    <rect x="240" y="1057" width="420" height="28" rx="6"
          fill="#E8F5E9" stroke="#388E3C" stroke-width="1.3"/>
    <text x="450" y="1076" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">rev_recv [N, E_local, M_max, H] -&gt; in-place mul by w * valid_mask</text>
  </g>
  <line x1="450" y1="1090" x2="450" y2="1112" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="350" y="1112" width="200" height="38" rx="6"
        fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="450" y="1131" text-anchor="middle" font-size="13" font-weight="600" fill="#0D47A1">out[T, H]</text>
  <text x="450" y="1145" text-anchor="middle" font-size="10" fill="#1976D2">index_add via original_indices * topk_weights</text>

  <g transform="translate(60, 458)">
    <rect x="0" y="0" width="195" height="80" rx="6" fill="#FFF8E1" stroke="#F57C00" stroke-width="1.2"/>
    <text x="98" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#BF360C">per-token NCCL cost</text>
    <text x="10" y="34" font-size="10" fill="#333" font-family="monospace">  bytes  = N*E_local*M_max*H*2</text>
    <text x="10" y="48" font-size="10" fill="#333" font-family="monospace">  legs   = 2 (dispatch + combine)</text>
    <text x="10" y="62" font-size="10" fill="#333" font-family="monospace">  layers = num_hidden_layers</text>
    <text x="10" y="76" font-size="10" fill="#333" font-family="monospace">  per-tok = 2 * L * t_a2a</text>
  </g>

  <g transform="translate(645, 458)">
    <rect x="0" y="0" width="195" height="80" rx="6" fill="#FFF8E1" stroke="#F57C00" stroke-width="1.2"/>
    <text x="97" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#BF360C">M_max policy</text>
    <text x="10" y="34" font-size="10" fill="#333" font-family="monospace">  avg = ceil(T_cap*K /</text>
    <text x="10" y="46" font-size="10" fill="#333" font-family="monospace">             (N*E_local))</text>
    <text x="10" y="60" font-size="10" fill="#333" font-family="monospace">  M_max = max(8, 4*avg)</text>
    <text x="10" y="74" font-size="10" fill="#333" font-family="monospace">  (override: --moe-ll-m-max)</text>
  </g>

</svg>
